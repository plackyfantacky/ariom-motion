<!doctype html>
<html lang="en-AU">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="icon" href="data:," />
        <link rel="stylesheet" href="./public/main.css" />
        <title>Ariom Motion</title>
    </head>
    <body>
        <div data-ariom-motion></div>
        <section id="portfolio-intro" class="portfolio-intro">
            <h1>Design meets development.</h1>
            <p>A little content to test moving HTML alongside the scene.</p>
        </section>

        <script type="module">
            import { createMotion } from "./dist/main.js";

            await createMotion({
                mountElement: document.querySelector("[data-ariom-motion]"),
            });

            motion.on("navigate", (event) => {
                console.log("Navigation requested:", event.params.url, event);
            });

            window.addEventListener("pagehide", () => { motion.destroy(); }, { once: true });
        </script>
    </body>
</html>
